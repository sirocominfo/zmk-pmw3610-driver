description: |
  Kimi 独自のクアドラチャ・ロータリーエンコーダー・デコーダー。

  ZMK本体の標準ドライバ(alps,ec11)は、A相・B相どちらかの変化を検知すると
  「両方の割り込みを止めてから、状態を読んで報告し終えるまで再開しない」
  という作りになっている。ALPS EC10E1220501のような「1回転24ディテント/
  12パルス」型（＝2ディテントで1クアドラチャ周期）のハーフステップ式
  エンコーダーでは、片側のディテント遷移で2本の接点がごく短い間隔で
  切り替わるため、その割り込み禁止の窓の中にもう一方の変化が収まってしまい
  丸ごと失われる（実機で確認、専用スレッド化でも改善せず）。

  このドライバは、変化を検知したその場（割り込みコンテキスト）でピンを読み
  演算するところまでを完結させ、割り込み自体は起動時に一度有効化したら
  以後一切無効化しない。時間のかかる「ZMKへ報告する」処理だけを専用スレッドへ
  逃がす。これにより上記の取りこぼしが原理的に起きなくなる。

compatible: "kimi,quad-encoder"

properties:
  a-gpios:
    type: phandle-array
    required: true
    description: A相ピン
  b-gpios:
    type: phandle-array
    required: true
    description: B相ピン
  steps:
    type: int
    default: 48
    description: |
      1回転あたりのクアドラチャ・エッジ数（＝PPR×4）。
      alps,ec11 の steps プロパティと同じ意味・同じ換算。
  dummy:
    type: boolean
    description: |
      true にすると割り込みを一切張らない。split構成でcentral側に置く
      「実際には配線されていないダミーノード」用（zmk,keymap-sensors の
      ローカル登録要件とKconfig依存を満たすためだけに存在させる場合）。
      a-gpios/b-gpios が完全に浮いた未接続ピンだと、割り込みを常時有効化する
      このドライバの設計ではノイズを拾って連続発火しかねないため、
      ダミー用途では最初から割り込みを張らないほうが安全。
